
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Code Quiz</h1>
            <p>Test your programming knowledge!</p>
        </header>

        <!-- Language Selection -->
        <section id="language-screen" class="card">
            <h2>Choose Your Programming Language</h2>
            <div id="language-list" class="language-grid"></div>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="card hidden">
            <div class="quiz-top">
                <span id="category-name"></span>
                <span>Time: <strong id="timer">15</strong>s</span>
            </div>

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <p id="question-number"></p>
            <h2 id="question"></h2>

            <div id="options" class="options"></div>

            <p id="feedback"></p>
            <button id="next-btn" class="main-btn" disabled>Next Question</button>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="card hidden">
            <h2>Quiz Completed!</h2>
            <p id="result-message"></p>
            <h1 id="score"></h1>
            <p id="result-details"></p>
            <button id="restart-btn" class="main-btn">Choose Another Language</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
